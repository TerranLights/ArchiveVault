<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1000"
     font-family="'Noto Sans CJK JP', 'Noto Sans JP', 'DejaVu Sans', sans-serif">
  <title>は / が — direction of weight</title>

  <defs>
    <marker id="fw" markerUnits="userSpaceOnUse" markerWidth="26" markerHeight="22"
            refX="24" refY="11" orient="auto"><path d="M0,0 L26,11 L0,22 Z" fill="#c0392b"/></marker>
    <marker id="bk" markerUnits="userSpaceOnUse" markerWidth="26" markerHeight="22"
            refX="24" refY="11" orient="auto"><path d="M0,0 L26,11 L0,22 Z" fill="#1a7a3a"/></marker>
    <marker id="sm" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="11"
            refX="13" refY="5.5" orient="auto"><path d="M0,0 L14,5.5 L0,11 Z" fill="#111"/></marker>
    <style>
      .hd   { font-size:20px; fill:#111; font-weight:bold; }
      .jp   { font-size:30px; fill:#2b4fc8; }
      .jpL  { font-size:42px; fill:#111; font-weight:bold; }
      .jpP  { font-size:30px; fill:#999; }
      .gl   { font-size:13.5px; fill:#555; }
      .lite { fill:none; stroke:#aaa; stroke-width:2; }
      .heavy{ fill:none; stroke:#111; stroke-width:5; }
      .ann  { font-size:14px; fill:#c0392b; }
      .ann2 { font-size:14px; fill:#1a7a3a; }
    </style>
  </defs>

  <rect width="1200" height="1000" fill="#fdfdfb"/>

  <!-- ===================================================== -->
  <!-- A. the mechanism                                       -->
  <!-- ===================================================== -->
  <text x="34" y="40" class="hd">A. 助詞が文の重みを送る向き</text>
  <text x="330" y="40" class="gl" font-size="15">the direction a particle sends the sentence's weight</text>

  <!-- は : forward -->
  <rect x="60"  y="74" width="200" height="74" class="lite"/>
  <text x="160" y="122" class="jp" text-anchor="middle">名詞</text>
  <text x="292" y="124" class="jpL" text-anchor="middle" fill="#c0392b">は</text>
  <rect x="340" y="68" width="300" height="86" class="heavy"/>
  <text x="490" y="124" class="jpL" text-anchor="middle">述部</text>

  <path d="M292,152 Q380,196 480,172" fill="none" stroke="#c0392b" stroke-width="5" marker-end="url(#fw)"/>
  <text x="680" y="104" class="ann" font-size="18">重みは前へ送られる</text>
  <text x="680" y="128" class="gl">the noun is only the ground you stand on;</text>
  <text x="680" y="148" class="gl">everything that matters is downstream</text>
  <text x="680" y="176" class="gl" font-style="italic">neutral, unmarked delivery</text>

  <!-- が : backward -->
  <rect x="60"  y="240" width="200" height="86" class="heavy"/>
  <text x="160" y="298" class="jpL" text-anchor="middle">名詞</text>
  <text x="292" y="296" class="jpL" text-anchor="middle" fill="#1a7a3a">が</text>
  <rect x="340" y="246" width="300" height="74" class="lite"/>
  <text x="490" y="294" class="jp" text-anchor="middle">述部</text>

  <path d="M292,330 Q230,374 172,344" fill="none" stroke="#1a7a3a" stroke-width="5" marker-end="url(#bk)"/>
  <text x="680" y="276" class="ann2" font-size="18">重みは後ろへ戻される</text>
  <text x="680" y="300" class="gl">the predicate is just a slot the noun drops into;</text>
  <text x="680" y="320" class="gl">the noun itself is the news</text>
  <text x="680" y="348" class="gl" font-style="italic">heavily marked — the spoken equivalent of all-caps</text>

  <line x1="34" y1="392" x2="1166" y2="392" stroke="#c0392b" stroke-width="2.6" stroke-dasharray="13,9"/>

  <!-- ===================================================== -->
  <!-- B. minimal pair                                        -->
  <!-- ===================================================== -->
  <text x="34" y="428" class="hd">B. 同じ構文・逆の向き</text>
  <text x="300" y="428" class="gl" font-size="15">same two-noun shape, opposite direction of pressure</text>

  <text x="60"  y="494" class="jp">それ</text>
  <text x="130" y="494" class="jpL" fill="#c0392b">は</text>
  <text x="178" y="494" class="jpL">本じゃない。</text>
  <path d="M138,508 Q226,548 300,520" fill="none" stroke="#c0392b" stroke-width="4" marker-end="url(#fw)"/>
  <text x="440" y="494" class="gl">plain report. それ is given; the information is 本じゃない.</text>
  <text x="440" y="516" class="gl" font-style="italic">"that's not a book"</text>

  <text x="60"  y="608" class="jpL">これ</text>
  <text x="152" y="608" class="jpL" fill="#1a7a3a">が</text>
  <text x="200" y="608" class="jp">本です。</text>
  <path d="M158,622 Q126,664 92,632" fill="none" stroke="#1a7a3a" stroke-width="4" marker-end="url(#bk)"/>
  <text x="440" y="608" class="gl">本です is almost incidental. The whole sentence lands on これ.</text>
  <text x="440" y="630" class="gl" font-style="italic">"THIS is a book"</text>

  <line x1="34" y1="676" x2="1166" y2="676" stroke="#c0392b" stroke-width="2.6" stroke-dasharray="13,9"/>

  <!-- ===================================================== -->
  <!-- C. the switch, within one discourse                    -->
  <!-- ===================================================== -->
  <text x="34" y="712" class="hd">C. 同じ名詞・助詞が切り替わる</text>
  <text x="372" y="712" class="gl" font-size="15">one noun, two sentences — the direction reverses as it becomes established</text>

  <text x="60"  y="776" class="jpL">花</text>
  <text x="108" y="776" class="jpL" fill="#1a7a3a">が</text>
  <text x="152" y="776" class="jp">咲いています。</text>
  <path d="M114,790 Q96,826 76,800" fill="none" stroke="#1a7a3a" stroke-width="4" marker-end="url(#bk)"/>
  <text x="60" y="846" class="gl">first mention — 花 is the news, weight falls back on it</text>

  <text x="520" y="776" class="jpL" fill="#999" font-size="34">→</text>

  <text x="600"  y="776" class="jp">花</text>
  <text x="640" y="776" class="jpL" fill="#c0392b">は</text>
  <text x="690" y="776" class="jpL">きれいです。</text>
  <path d="M650,790 Q728,828 800,804" fill="none" stroke="#c0392b" stroke-width="4" marker-end="url(#fw)"/>
  <text x="600" y="846" class="gl">now established ground — weight is sent forward onto きれい</text>

  <line x1="34" y1="872" x2="1166" y2="872" stroke="#ccc" stroke-width="1.6"/>
  <text x="34" y="900" class="gl" font-size="14.5" font-weight="bold">Two consequences that fall out of the same mechanism, not from separate rules:</text>
  <text x="34" y="926" class="gl" font-size="14.5">1. 誰<tspan fill="#1a7a3a" font-weight="bold">が</tspan>来ましたか → 田中さん<tspan fill="#1a7a3a" font-weight="bold">が</tspan>来ました — both が, because a question about the subject and its answer both put the weight there.</text>
  <text x="34" y="952" class="gl" font-size="14.5">2. は cannot sit inside a subordinate clause (私<tspan fill="#1a7a3a" font-weight="bold">が</tspan>行くとき, never ×私は行くとき): its forward reach is sentence-level</text>
  <text x="58" y="976" class="gl" font-size="14.5">and would overshoot the clause edge, while が's backward pull stays local.</text>
</svg>
